[project]
name = "mag-pendant"
version = "0.1.0"
description = "Lightweight macOS agent for syncing Limitless pendant audio and transcripts"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.21.0",
    "protobuf>=4.0",
    "opuslib>=3.0.1",
    "click>=8.0",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
mag = "mag_pendant.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mag_pendant"]
